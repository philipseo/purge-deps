name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Require pending changeset
        shell: bash
        run: |
          shopt -s nullglob
          pending=()
          for file in .changeset/*.md; do
            [[ "$(basename "$file")" == "README.md" ]] && continue
            pending+=("$file")
          done
          if [ ${#pending[@]} -eq 0 ]; then
            echo "No pending changesets. Add one with: pnpm changeset"
            exit 1
          fi

      # package.json version is compiled into --version by build.rs
      - run: pnpm run version
        shell: bash

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.asset }}"
          name=purge-deps
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            name=purge-deps.exe
          fi
          cp "target/${{ matrix.target }}/release/${name}" "out/${{ matrix.asset }}/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run version

      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .changeset
          git commit -m "Version packages"

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-*"
          path: bin
          merge-multiple: true

      - run: find bin -type f ! -name '*.exe' ! -name '*.js' -exec chmod +x {} +

      - name: Verify platform binaries
        run: |
          for f in \
            bin/linux-x64/purge-deps \
            bin/linux-arm64/purge-deps \
            bin/darwin-arm64/purge-deps \
            bin/darwin-x64/purge-deps \
            bin/win32-x64/purge-deps.exe \
            bin/purge-deps.js
          do
            test -e "$f" || { echo "missing $f"; ls -R bin; exit 1; }
          done

      - run: pnpm release
      - run: git push --follow-tags
